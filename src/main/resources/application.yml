spring:
  application:
    name: examen-invex
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

app:
  security:
    # No defaults on purpose: the service does not start unless these are provided.
    reader:
      username: ${API_READER_USERNAME:}
      password: ${API_READER_PASSWORD:}
    admin:
      username: ${API_ADMIN_USERNAME:}
      password: ${API_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Employee management microservice

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
  paths-to-match: /employees/**

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{correlationId:-no-correlation}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{correlationId:-no-correlation}] %logger{36} - %msg%n"
  file:
    # Set LOG_FILE (for example logs/examen-invex.log) to also write logs to a rolling file.
    name: ${LOG_FILE:}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
  level:
    root: INFO
    com.invex.examen: ${LOG_LEVEL:INFO}
