# Runs the service with its MySQL database.
# Copy .env.example to .env and set real values before running: docker compose up --build
services:
  mysql:
    image: mysql:8.0.40
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: examen_invex
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: examen-invex:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/examen_invex?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      API_READER_USERNAME: ${API_READER_USERNAME:?API_READER_USERNAME is required}
      API_READER_PASSWORD: ${API_READER_PASSWORD:?API_READER_PASSWORD is required}
      API_ADMIN_USERNAME: ${API_ADMIN_USERNAME:?API_ADMIN_USERNAME is required}
      API_ADMIN_PASSWORD: ${API_ADMIN_PASSWORD:?API_ADMIN_PASSWORD is required}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  mysql-data:
