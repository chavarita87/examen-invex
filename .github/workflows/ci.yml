name: CI

on:
  push:
    branches: [develop, main, "release/**", "hotfix/**"]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build, run tests and check coverage (80% minimum)
        run: ./mvnw -B verify

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            target/surefire-reports/
            target/site/jacoco/

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Scan dependencies and configuration (report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH

      - name: Publish results to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Fail on critical vulnerabilities with an available fix
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

  docker:
    name: Build and scan Docker image
    runs-on: ubuntu-latest
    needs: [build-test, dependency-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t examen-invex:${{ github.sha }} .

      - name: Fail on critical vulnerabilities in the image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: examen-invex:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
